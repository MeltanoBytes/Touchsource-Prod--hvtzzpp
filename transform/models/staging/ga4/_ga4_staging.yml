version: 2

models:
  - name: stg_ga4__dau_stats
    description: "Daily aggregated user and session metrics from GA4."
    columns:
      - name: dau_raw_id
      - name: dau_extracted_at
      - name: dau_meta
      - name: dau_generation_id
      - name: dau_property_id
      - name: account_name
        description: "GA4 user property account_name. Optional. The core models prefer the current name from stg_account."
      - name: account_uuid
        description: "GA4 user property account_uuid — the Touch Analytics row-level security key. NULL for mobile and for touch rows synced before the column existed; GA4 reports an unset property as '(not set)'. Neither matches a real uuid, so the dashboard hides those rows."
      - name: system_name
      - name: system_group_name
        description: "GA4 user property system_group_name. NULL for mobile and for touch rows synced before the dimension was added."
      - name: system_group_uuid
        description: "GA4 user property system_group_uuid — narrows the row-level security rule for property-scoped users. NULL for mobile and for touch rows synced before the column existed; GA4 reports an unset property as '(not set)'. Neither matches a real uuid, so the dashboard hides those rows."
      - name: system_uuid
        description: "GA4 user property system_uuid. NULL for mobile and for touch rows synced before the dimension was added."
      - name: dau_project_number
      - name: dau_start_date
      - name: dau_end_date
      - name: dau_sessions
      - name: dau_event_count
      - name: dau_active_users
      - name: dau_avg_session_duration
      - name: dau_user_engagement_duration
      - name: ga4_source
