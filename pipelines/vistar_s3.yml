version: pipelines/v0.1
label: vistar_s3
timeout: 36000
max_retries: 0
script: |-
  meltano run tap-spreadsheets-s3 target-snowflake --state-id-suffix vistar-s3
data_components:
- tap-spreadsheets-s3
- Snowflake - SnowflakeIngestion
properties:
  tap-spreadsheets-s3.tables: '[{"name": "screenverse_revenue", "path": "s3://screenverse-touchsource-akfq43tzm3fc", "search_prefix": "touchsource/revenue/", "pattern": "^touchsource/revenue/.+\\.csv\\.gz$", "start_date": "2026-10-01T00:00:00.000000Z", "key_properties": ["_smart_source_file", "_smart_source_lineno"], "format": "csv", "delimiter": ",", "invalid_format_action": "ignore", "ignore_undefined_field_names": true, "prefer_schema_as_string": true}, {"name": "screenverse_billing", "path": "s3://screenverse-touchsource-akfq43tzm3fc", "search_prefix": "touchsource/billing/", "pattern": "^touchsource/billing/.+-byhour\\.csv(\\.gz)?$", "start_date": "2026-10-01T00:00:00.000000Z", "key_properties": ["_smart_source_file", "_smart_source_lineno"], "format": "csv", "delimiter": ",", "invalid_format_action": "ignore", "ignore_undefined_field_names": true, "prefer_schema_as_string": true}]'
  tap-spreadsheets-s3._select: '["screenverse_revenue.*","screenverse_billing.*"]'
  Snowflake - SnowflakeIngestion.default_target_schema: raw_vistar_meltano
  Snowflake - SnowflakeIngestion.add_record_metadata: true
