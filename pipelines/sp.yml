version: pipelines/v0.1
label: sp
timeout: 3600
max_retries: 0
script: |-
  meltano run --full-refresh tap-spreadsheets-sharepoint-app-registration target-snowflake --state-id-suffix sp
data_components:
- tap-spreadsheets-sharepoint-app-registration
- Snowflake - SnowflakeIngestion
properties:
  tap-spreadsheets-sharepoint-app-registration.tables: '[{"name": "ads_08_2026", "path": "sharepoint://Advertising/Documents/", "pattern": "^/ad_rev/(.+/)?ads_08_2026\\.csv$", "start_date": "2020-01-01T00:00:00Z", "key_properties": [], "format": "csv", "delimiter": ",", "invalid_format_action": "ignore", "ignore_undefined_field_names": true, "prefer_schema_as_string": true}]'
  tap-spreadsheets-sharepoint-app-registration._select: '["ads_08_2026.*"]'
  Snowflake - SnowflakeIngestion.default_target_schema: raw_sp_meltano
  Snowflake - SnowflakeIngestion.load_method: overwrite
  Snowflake - SnowflakeIngestion.add_record_metadata: true
