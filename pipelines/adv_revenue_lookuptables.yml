version: pipelines/v0.1
label: adv_revenue_lookuptables
schedule: '@daily'
timeout: 7200
max_retries: 0
script: |-
  meltano run --full-refresh tap-spreadsheets-sharepoint-app-registration target-snowflake --state-id-suffix adv-revenue-lookuptables
  meltano run dbt:deps
  meltano invoke dbt run --select +fct__ad_revenue_daily +fct__ad_revenue_monthly
data_components:
- tap-spreadsheets-sharepoint-app-registration
- Snowflake - SnowflakeIngestion
- dbt
