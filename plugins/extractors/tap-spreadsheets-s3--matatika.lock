{
  "plugin_type": "extractors",
  "name": "tap-spreadsheets-s3",
  "namespace": "tap_spreadsheets_s3",
  "variant": "matatika",
  "label": "Spreadsheets S3",
  "docs": "https://www.matatika.com/data-details/tap-spreadsheets-s3/",
  "repo": "https://github.com/Matatika/tap-spreadsheets-anywhere",
  "pip_url": "git+https://github.com/Matatika/tap-spreadsheets-anywhere.git@v0.7.0",
  "executable": "tap-spreadsheets-anywhere",
  "description": "Spreadsheets S3 is a software tool that allows users sync data from spreadsheets stored in Amazon S3 into their chosen targets.",
  "logo_url": "/assets/images/datasource/tap-spreadsheets-anywhere.png",
  "capabilities": [
    "catalog",
    "discover",
    "state"
  ],
  "settings": [
    {
      "name": "tables",
      "kind": "array",
      "label": "Tables",
      "description": "A setting in Spreadsheets Anywhere that allows users to select which tables they want to connect to and use in their application.",
      "hidden": false,
      "sensitive": false,
      "required": "true",
      "configured": false,
      "protected": false
    },
    {
      "name": "aws_access_key_id",
      "env": "AWS_ACCESS_KEY_ID",
      "kind": "string",
      "label": "AWS Access Key ID",
      "hidden": false,
      "sensitive": true,
      "required": "true",
      "configured": false,
      "protected": false
    },
    {
      "name": "aws_secret_access_key",
      "env": "AWS_SECRET_ACCESS_KEY",
      "kind": "string",
      "label": "AWS Secret Access Key",
      "hidden": false,
      "sensitive": true,
      "required": "true",
      "configured": false,
      "protected": false
    },
    {
      "name": "batch_config.encoding.format",
      "kind": "options",
      "label": "Batch Format",
      "description": "Format of the batch files. This tap only supports Arrow.",
      "options": [
        {
          "label": "Arrow",
          "value": "arrow"
        }
      ],
      "hidden": false,
      "sensitive": false,
      "configured": false,
      "protected": false
    },
    {
      "name": "batch_config.storage.root",
      "kind": "string",
      "label": "Batch Root Directory",
      "description": "The root directory where the batch files will be stored. Defaults to the system's temporary directory if not specified.",
      "hidden": false,
      "sensitive": true,
      "configured": false,
      "protected": false
    },
    {
      "name": "batch_config.batch_size",
      "kind": "integer",
      "label": "Batch Size",
      "description": "Number of rows per BATCH message file. Defaults to 100,000 if not specified.",
      "hidden": false,
      "sensitive": false,
      "configured": false,
      "protected": false
    }
  ]
}
