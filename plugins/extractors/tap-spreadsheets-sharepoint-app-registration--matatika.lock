  "description": "Sync spreadsheets data from SharePoint, as an application and with no user sign-in\n\nThe tap reads files with the Microsoft Graph API, and authenticates with the OAuth 2.0 client\ncredentials flow - use this specialisation for a scheduled sync\n\n## Setup\n\nIn the Microsoft Entra admin center or Microsoft Entra ID section of the Azure portal:\n1. Create an app registration under **App registrations** > **New registration**, with the\n   **Accounts in this organizational directory only** account type and no redirect URI\n1. Add a client secret under **Certificates & secrets** - copy the **Value** column, because the\n   portal masks the value after you leave the page, and record the expiry date, because the tap\n   fails when the secret expires\n1. Add the `Sites.Read.All` **Application permission** for Microsoft Graph under\n   **API permissions**, then select **Grant admin consent** - an application permission has no\n   user consent, so a tenant administrator must grant the consent, and the permission must show\n   the **Granted** state, or Microsoft Graph responds with `401 Unauthorized` and no explicit\n   notice that the consent is absent\n\nIn SharePoint:\n1. Identify the site you want to sync files from\n1. Identify the directory structure where the files you want to sync exist\n\nIn Meltano Cloud:\n1. Add the app registration configuration for Client ID, Client Secret and Tenant ID\n1. Add Tables configuration, with respect to the identified site and directory structure\n\n### Restrict the access to named sites\n\nThe `Sites.Read.All` application permission lets the application read every site of the tenant.\nTo give the application access to named sites only, use the `Sites.Selected` application\npermission in place of it. This permission grants no access on consent - a SharePoint\nadministrator grants the application access to each site, with the Microsoft Graph API:\n\n1. In **API permissions**, remove `Sites.Read.All`, add the `Sites.Selected`\n   **Application permission** for Microsoft Graph, then select **Grant admin consent**\n\n   Go to **Enterprise applications** also, select the application, and revoke `Sites.Read.All`\n   under **Security** > **Permissions**. The application keeps a granted permission until you\n   revoke it there. A change of permissions can take some minutes to apply, and an access token\n   keeps the permissions that it had at issue time, for the full lifetime of the token.\n1. Open [Graph Explorer](https://developer.microsoft.com/graph/graph-explorer), sign in as a\n   tenant administrator, and consent to `Sites.FullControl.All` on the **Modify permissions**\n   tab - Graph Explorer makes the requests below as itself, so it needs this permission\n\n   Do not give `Sites.FullControl.All` to the app registration of the tap, even for a short time.\n   This permission gives write access to every site of the tenant.\n1. Get the ID of the site, where `<host>` is the SharePoint host of the tenant (such as\n   `<tenant>.sharepoint.com`) and `<site_name>` is the last part of the URL of the site\n\n   ```http\n   GET https://graph.microsoft.com/v1.0/sites/<host>:/sites/<site_name>\n   ```\n\n1. Grant the read role on that site to the application, where `id` is the application (client) ID\n   of the app registration and `displayName` is a label only\n\n   ```http\n   POST https://graph.microsoft.com/v1.0/sites/<site_id>/permissions\n\n   {\n       \"roles\": [\"read\"],\n       \"grantedToIdentities\": [\n           {\n               \"application\": {\n                   \"id\": \"<client_id>\",\n                   \"displayName\": \"<application_name>\"\n               }\n           }\n       ]\n   }\n   ```\n\n1. Repeat the last two steps for each site\n\nTo remove the access to a site, get the ID of the site, then list the permissions of that site\nwith `GET https://graph.microsoft.com/v1.0/sites/<site_id>/permissions`. Find the item where\n`grantedToIdentitiesV2` names the application, and delete that permission with\n`DELETE https://graph.microsoft.com/v1.0/sites/<site_id>/permissions/<permission_id>`.\n\n## Enable BATCH mode for large syncs (optional)\n\nInstead of one record message per row, the tap can buffer rows and write them to Arrow IPC\nfiles, then emit batch messages that reference them - a compatible target loads these files\ndirectly instead of processing records one at a time. Set Batch Format, Batch Root Directory\nand Batch Size to enable it.\n\n> **Caveats** \u2014 `arrow` is the only batch encoding this tap supports; only a target that\n> advertises the `batch` capability processes batch messages, so leave these settings unset\n> for any other target. Enabling BATCH mode does not otherwise change the schema seen\n> downstream - use the `arrow_native_timestamps` table definition field (see Tables) to\n> control whether a `date-time` column is typed as a native Arrow timestamp or left as a\n> string in this mode.\n",
