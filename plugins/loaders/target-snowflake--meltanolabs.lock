    {
      "name": "ingestion_method",
      "kind": "options",
      "value": "file_staging",
      "label": "Ingestion Method",
      "description": "How records are loaded into Snowflake. 'file_staging' (default) stages local batch files and loads them with COPY INTO/MERGE INTO, per `load_method`; this requires a running warehouse. 'snowpipe_streaming' ingests rows directly via the Snowpipe Streaming API, with no warehouse required and billing based on data ingested. Only key-pair authentication is supported in this mode, and `hard_delete` is not supported. `load_method: overwrite` truncates via a regular SQL connection before streaming begins, same as with `file_staging`. `load_method: upsert` needs MERGE, which streaming doesn't support, so any individual stream with key properties falls back to `file_staging` for that stream only (with a logged warning) rather than failing the whole sync -- other streams keep streaming.",
      "options": [
        {
          "label": "File Staging",
          "value": "file_staging"
